# Natal Lumen — nginx
#
#   https://DOMINIO/         -> site publico   (site/dist)
#   https://DOMINIO/acesso   -> sistema        (sistema/frontend/dist)
#   https://DOMINIO/acesso/api -> uvicorn       (127.0.0.1:8000)
#
# Troque DOMINIO e os caminhos /var/www/... pelos reais.

# Limites por IP. Ficam fora do server{} de proposito: as zonas sao
# compartilhadas por todos os processos do nginx.
#
# O sistema ja bloqueia a CONTA apos 5 tentativas falhas. Isso nao impede que
# alguem teste uma senha comum contra mil emails diferentes — cada conta sofre
# so uma tentativa, e nenhuma trava. O limite por IP e que fecha essa porta.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m   rate=120r/m;
limit_req_status 429;

server {
    listen 80;
    server_name DOMINIO www.DOMINIO;
    # Tudo por HTTPS: o cookie da sessao usa Secure e nao viajaria em HTTP.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # Forma nova (nginx 1.25+). Em versoes antigas use: listen 443 ssl http2;
    http2 on;
    server_name DOMINIO www.DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;

    # As fotos dos cartoes sobem por aqui.
    client_max_body_size 25M;

    # ------------------------------------------------- entrada e senhas
    # As rotas em que adivinhar vale a pena. 10 por minuto por IP, com folga
    # de 5 para quem errou a senha e tenta de novo na hora.
    location ~ ^/acesso/api/(auth/(?:login|esqueci-senha|definir-senha))$ {
        limit_req zone=login burst=5 nodelay;

        # $1 e o caminho SEM o prefixo /acesso/api — o mesmo efeito da barra
        # no fim do proxy_pass do bloco abaixo. A aplicacao atende /auth/login.
        proxy_pass http://127.0.0.1:8000/$1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------- API
    # A barra no fim do proxy_pass e essencial: ela REMOVE o prefixo
    # /acesso/api antes de encaminhar. A aplicacao atende em /auth/login, e o
    # root_path do FastAPI serve so para montar links e documentacao.
    location /acesso/api/ {
        # 120 por minuto cobre o uso normal com folga; o burst absorve a
        # rajada de quem abre uma tela que busca varias coisas de uma vez.
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://127.0.0.1:8000/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O OCR de um cartao pode passar de 30s na primeira chamada.
        proxy_read_timeout 120s;
    }

    # ------------------------------------------------------------- sistema
    location /acesso {
        alias /var/www/natal-lumen/sistema/frontend/dist;

        # SPA: qualquer subrota devolve o index.html, senao abrir
        # /acesso/criancas direto no navegador daria 404.
        try_files $uri $uri/ /acesso/index.html;

        # O sistema nao deve aparecer em buscador nenhum.
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Os arquivos de assets levam hash no nome, entao podem ficar em cache
    # para sempre. O index.html, nunca — senao o navegador continuaria
    # servindo uma versao velha depois de publicar.
    location ~* ^/acesso/assets/(.+)$ {
        alias /var/www/natal-lumen/sistema/frontend/dist/assets/$1;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --------------------------------------------------------- site publico
    location / {
        root /var/www/natal-lumen/site/dist;
        try_files $uri $uri/ /index.html;
    }

    # ARQUIVOS_DIR nunca e servido daqui: as imagens dos cartoes so saem por
    # GET /acesso/api/cartoes/{id}/imagem, que confere sessao e permissao.
}
