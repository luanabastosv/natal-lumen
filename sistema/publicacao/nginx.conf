# Natal Lumen — nginx
#
#   https://SUBDOMINIO/           -> redireciona para /acesso/
#   https://SUBDOMINIO/acesso     -> sistema   (sistema/frontend/dist)
#   https://SUBDOMINIO/acesso/api -> uvicorn   (127.0.0.1:8000)
#
# O SITE PUBLICO NAO ESTA AQUI. Ele vive no Shopify, em natallumen.com. Este
# servidor atende so o subdominio do sistema:
#
#   natallumen.com          Shopify      loja e site
#   acesso.natallumen.com   este servidor   producao
#   teste.natallumen.com    este servidor   redireciona para acesso (virar-producao.sh)
#
# O prefixo /acesso continua no caminho mesmo em subdominio, porque ele esta
# gravado no build do frontend (vite.config.js), no cookie da sessao
# (COOKIE_PATH) e no root_path do FastAPI. Tirar os tres seria mexer em coisa
# testada as vesperas de subir; o redirect da raiz resolve na pratica: quem
# digita acesso.natallumen.com cai direto na tela de entrada.
#
# Troque SUBDOMINIO pelo dominio real antes de usar.
#
# ---------------------------------------------------------------------------
# ESTE ARQUIVO E SO HTTP (porta 80), DE PROPOSITO.
#
# Quem acrescenta o HTTPS e o certbot: `sudo certbot --nginx -d SUBDOMINIO`
# reescreve este bloco para a porta 443, aponta o certificado e cria sozinho o
# redirect de 80 para 443. Se o arquivo ja viesse com `ssl_certificate`
# apontando para um certificado que ainda nao existe, o nginx recusaria a
# subir e voce nao conseguiria nem rodar o certbot. Primeiro sobe em HTTP,
# depois o certbot promove.
# ---------------------------------------------------------------------------

# Limites por IP. Ficam fora do server{} de proposito: as zonas sao
# compartilhadas por todos os processos do nginx.
#
# O sistema ja bloqueia a CONTA apos 5 tentativas falhas. Isso nao impede que
# alguem teste uma senha comum contra mil emails diferentes — cada conta sofre
# so uma tentativa, e nenhuma trava. O limite por IP e que fecha essa porta.
#
# ATENCAO: isto so funciona com o DNS em "DNS only" no Cloudflare (nuvem
# cinza). Com o proxy ligado (nuvem laranja), todo pedido chega com o IP do
# Cloudflare e estas duas zonas viram um limite unico para o mundo inteiro —
# o primeiro atacante consumiria a cota de todos. Para ligar o proxy depois,
# e preciso antes configurar set_real_ip_from + real_ip_header CF-Connecting-IP.
#
# O limite e por IP, e um IP pode ser muita gente: o Wi-Fi do treinamento, o
# do local do evento, e as operadoras de celular, que poem milhares de
# aparelhos atras do mesmo endereco. Com 10/min no login e 120/min na API, uma
# sala de 15 voluntarios entrando juntos levava 429. Os numeros abaixo deixam
# passar uma sala cheia e ainda cortam quem tenta milhares de senhas.
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:10m   rate=600r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name SUBDOMINIO;

    # As fotos dos cartoes sobem por aqui.
    client_max_body_size 25M;

    # Pasta vazia. Serve so para o certbot depositar o desafio que prova a
    # posse do dominio, e para que qualquer endereco fora de /acesso responda
    # 404 em vez da pagina "Welcome to nginx!", que denuncia o que roda aqui.
    # Na instalacao: sudo rm -f /var/www/html/index.nginx-debian.html
    root /var/www/html;

    # O sistema nao deve aparecer em buscador nenhum — nem o de producao,
    # nem o de teste.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ------------------------------------------------------------- a raiz
    # Em subdominio, ninguem vai digitar /acesso na mao. Quem chega em
    # acesso.natallumen.com e mandado para a tela de entrada.
    location = / {
        return 301 /acesso/;
    }

    # ------------------------------------------------- entrada e senhas
    # As rotas em que adivinhar vale a pena. 30 por minuto por IP, com folga
    # de 20 para a sala inteira que entra ao mesmo tempo.
    location ~ ^/acesso/api/(auth/(?:login|esqueci-senha|definir-senha))$ {
        limit_req zone=login burst=20 nodelay;

        # $1 e o caminho SEM o prefixo /acesso/api — o mesmo efeito da barra
        # no fim do proxy_pass do bloco abaixo. A aplicacao atende /auth/login.
        proxy_pass http://127.0.0.1:8000/$1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------- API
    # A barra no fim do proxy_pass e essencial: ela REMOVE o prefixo
    # /acesso/api antes de encaminhar. A aplicacao atende em /auth/login, e o
    # root_path do FastAPI serve so para montar links e documentacao.
    location /acesso/api/ {
        # 600 por minuto por IP: varias pessoas atras do mesmo endereco, cada
        # uma abrindo telas que buscam varias coisas de uma vez.
        limit_req zone=api burst=200 nodelay;

        proxy_pass http://127.0.0.1:8000/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Importar uma planilha grande passa dos 30s padrao.
        proxy_read_timeout 120s;
    }

    # Os arquivos de assets levam hash no nome, entao podem ficar em cache
    # para sempre. O index.html, nunca — senao o navegador continuaria
    # servindo uma versao velha depois de publicar.
    location ~* ^/acesso/assets/(.+)$ {
        alias /var/www/natal-lumen/sistema/frontend/dist/assets/$1;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------- sistema
    location /acesso {
        alias /var/www/natal-lumen/sistema/frontend/dist;

        # O index.html (e o manifesto, os icones) sem cache: o navegador
        # confere a cada abertura se mudou — com o ETag, quase sempre e um 304
        # de poucos bytes. Sem isto o celular guardava a pagina por horas, e o
        # app da tela de inicio abria a versao velha depois de publicar.
        # O X-Robots-Tag se repete aqui porque um add_header no location
        # apaga os do server.
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        # SPA: qualquer subrota devolve o index.html, senao abrir
        # /acesso/criancas direto no navegador daria 404.
        try_files $uri $uri/ /acesso/index.html;
    }

    # ARQUIVOS_DIR nunca e servido daqui: as imagens dos cartoes so saem por
    # GET /acesso/api/cartoes/{id}/imagem, que confere sessao e permissao.
}
